<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160d1f">
  <title>404 // BSL LIVE</title>
  <style>
    :root { color-scheme:dark; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; background:#160d1f; color:#fff4f0; font-family:"Segoe UI",Arial,sans-serif; display:flex; flex-direction:column; }
    header { border-bottom:1px solid #392443; padding:25px 32px; font-size:18px; font-weight:800; letter-spacing:1px; }
    header span { color:#fb923c; }
    main { flex:1; display:grid; place-items:center; text-align:center; padding:60px 22px; }
    .eyebrow { color:#fb923c; font:11px Consolas,monospace; letter-spacing:2px; }
    .code { color:#c084fc; font:800 clamp(100px,22vw,180px)/1 "Segoe UI",sans-serif; letter-spacing:-8px; margin:15px 0 25px; text-shadow:0 0 65px #a855f730; }
    h1 { font-size:clamp(23px,4vw,32px); margin:0 0 15px; }
    p { color:#b7a6c1; font-size:14px; line-height:1.8; margin-bottom:32px; }
    a { display:inline-block; color:#21132b; background:#fb923c; padding:14px 25px; border-radius:7px; font-weight:700; font-size:13px; text-decoration:none; }
    a:hover { background:#ffab65; }
    a:focus-visible { outline:2px solid #c084fc; outline-offset:5px; }
    footer { padding:25px; border-top:1px solid #392443; text-align:center; color:#b7a6c1; font:10px Consolas,monospace; }
  </style>
</head>
<body>
  <header>BSL <span>// LIVE</span></header>
  <main><div><div class="eyebrow">ROUTE NOT FOUND</div><div class="code">404</div><h1>Lost connection to this route.</h1><p>This address leads outside the lounge.<br>Your next conversation is one click away.</p><a href="/">← Back to the lounge</a></div></main>
  <footer>Developer Lounge · Powered by Bonezegei · localhost:8081</footer>
</body>
</html>
